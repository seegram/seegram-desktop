name: SeeGram Windows Release Recovery
run-name: "Resume Windows build ${{ inputs.counter }} · ${{ inputs.source_sha }}"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Original release commit (full SHA)
        type: string
        required: true
      counter:
        description: Original committed build counter
        type: string
        required: true
      diagnostics_only:
        description: Read the previous dependency failure without rebuilding
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seegram-release
  cancel-in-progress: false

jobs:
  windows:
    name: Resume Windows x64
    runs-on: [self-hosted, Windows, X64, seegram]
    timeout-minutes: 360
    steps:
      - name: Restore and verify the original release revision
        if: ${{ !inputs.diagnostics_only }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_COUNTER: ${{ inputs.counter }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$' -or $env:RELEASE_COUNTER -notmatch '^[1-9][0-9]{0,9}$') {
            throw 'Expected an exact commit and a positive build counter'
          }
          if ([long]$env:RELEASE_COUNTER -gt 4294967295) { throw 'Build counter is too large' }
          if (-not $env:SEEGRAM_TREE -or -not (Test-Path "$env:SEEGRAM_TREE\.git")) { throw 'Prepared checkout is missing' }
          Set-Location $env:SEEGRAM_TREE
          $dirty = git status --porcelain --untracked-files=no
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Checkout is not clean; repair it before resuming' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('x-access-token:' + $env:GH_TOKEN))
          Write-Host "::add-mask::$auth"
          git -c submodule.recurse=false -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --quiet origin $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the original commit' }
          git reset --quiet --hard --no-recurse-submodules $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not select the original commit' }
          git submodule sync --quiet --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not sync submodules' }
          git submodule update --quiet --init --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare submodules' }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:SOURCE_SHA) { throw 'Wrong release revision' }
          $counter = (Select-String -Path 'Telegram/SourceFiles/fork/build_counter.h' -Pattern '^#define SEEGRAM_BUILD_COUNTER (\d+)').Matches[0].Groups[1].Value
          if ($counter -ne $env:RELEASE_COUNTER) { throw 'Counter differs from the original source' }
          $version = (Select-String -Path 'Telegram/SourceFiles/core/version.h' -Pattern 'AppVersionStr = "([^"]*)"').Matches[0].Groups[1].Value
          $tag = "v$version-$counter"
          $refJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Original release tag is missing' }
          $ref = $refJson | ConvertFrom-Json
          if ($ref.object.type -ne 'commit' -or $ref.object.sha -ne $head) { throw 'Release tag points to another commit' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Create the original GitHub release before resuming' }
          $base = [long](Select-String -Path 'Telegram/SourceFiles/core/version.h' -Pattern 'AppVersion = (\d+);').Matches[0].Groups[1].Value
          $expected = ($base -shl 32) -bor [long]$counter
          $feed = Invoke-RestMethod -Uri 'https://desktop.see.tg/current4' -TimeoutSec 30
          if ([long]$feed.win64.stable.released -ge $expected) {
            throw 'Windows already serves this or a newer version; recover installer uploads without rebuilding it'
          }
          Write-Host "Verified $tag at $head"

      - name: Update Windows SDK headers for Windows Hello
        if: ${{ !inputs.diagnostics_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Include/10.0.26100.0/cppwinrt/winrt'
          function Test-WalletSdk {
            $header = Join-Path $sdk 'Windows.Security.Credentials.h'
            $interfaces = Join-Path $sdk 'impl/Windows.Security.Credentials.0.h'
            return ((Test-Path $header) -and (Test-Path $interfaces) -and
              (Select-String -Path $header -SimpleMatch 'RequestCreateForWindowAsync' -Quiet) -and
              (Select-String -Path $interfaces -SimpleMatch 'IKeyCredentialWithWindow' -Quiet))
          }
          if (-not (Test-WalletSdk)) {
            Write-Host 'Updating Windows SDK 26100 to its September 2026 servicing release'
            $installer = Join-Path $env:RUNNER_TEMP 'seegram-winsdk-26100.exe'
            Invoke-WebRequest -Uri 'https://download.microsoft.com/download/46742ab5-6592-4968-a793-129e7f3bc55a/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe' -OutFile $installer
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Windows SDK installer signature is invalid' }
            $setup = Start-Process -FilePath $installer -ArgumentList @('/features', 'OptionId.DesktopCPPx64', 'OptionId.UWPCPP', '/quiet', '/norestart') -Wait -PassThru
            if ($setup.ExitCode -notin @(0, 3010)) { throw "Windows SDK update failed: $($setup.ExitCode)" }
            if (-not (Test-WalletSdk)) { throw 'Windows Hello SDK declarations are still missing' }
          }
          Write-Host 'Windows Hello SDK declarations are available'

      - name: Prepare the upstream Windows build tools
        if: ${{ !inputs.diagnostics_only }}
        shell: pwsh
        env:
          Platform: x64
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:SEEGRAM_TREE
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Visual Studio C++ tools are missing' }
          $toolset = (Get-Content (Join-Path $vs 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          $english = Join-Path $vs "VC/Tools/MSVC/$toolset/bin/Hostx64/x64/1033/clui.dll"
          if (-not (Test-Path $english -PathType Leaf)) {
            Write-Host 'Installing the English compiler resources required by upstream FFmpeg'
            $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
            if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Add the English Visual Studio language pack with the installer before resuming' }
            $channel = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property channelId
            $installer = Join-Path (Split-Path $vswhere -Parent) 'setup.exe'
            $setup = Start-Process -FilePath $installer -ArgumentList @('modify', '--installPath', "`"$vs`"", '--channelId', $channel, '--addProductLang', 'en-US', '--quiet', '--norestart') -Wait -PassThru
            if ($setup.ExitCode -notin @(0, 3010)) { throw "Visual Studio language installation failed: $($setup.ExitCode)" }
            if (-not (Test-Path $english -PathType Leaf)) { throw 'English compiler resources are still missing' }
          }
          $env:VSLANG = '1033'
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          $thirdParty = Join-Path (Split-Path $env:SEEGRAM_TREE -Parent) 'ThirdParty'
          $stamp = Join-Path $thirdParty '.seegram-recovery-tools'
          $identity = (Get-FileHash 'Telegram/build/prepare/prepare.py' -Algorithm SHA256).Hash
          $required = @('msys64/ucrt64/bin/perl.exe', 'msys64/ucrt64/bin/nasm.exe', 'jom/jom.exe', 'python/Scripts/python.exe', 'rust/cargo/bin/cargo.exe')
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $thirdParty $_) -PathType Leaf) })
          if ($missing.Count -eq 0 -and (Test-Path $stamp) -and (Get-Content -Raw $stamp).Trim() -eq $identity) {
            Write-Host 'Upstream Windows tools are already prepared'
          } else {
            python Telegram/build/prepare/prepare.py silent msys64 python NuGet jom gyp rust
            if ($LASTEXITCODE -ne 0) { throw 'Upstream build-tool preparation failed' }
            foreach ($relative in $required) {
              if (-not (Test-Path (Join-Path $thirdParty $relative) -PathType Leaf)) { throw "Prepared tool is missing: $relative" }
            }
            Set-Content -Path $stamp -Value $identity
          }

      - name: Build, sign and publish Windows
        if: ${{ !inputs.diagnostics_only }}
        shell: pwsh
        env:
          Platform: x64
          VSLANG: '1033'
          RELEASE_COUNTER: ${{ inputs.counter }}
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
          GH_TOKEN: ${{ github.token }}
          SEEGRAM_KEYS_DIR: ${{ secrets.SEEGRAM_KEYS_DIR }}
          SEEGRAM_KEY_FILE: ${{ secrets.SEEGRAM_KEY_FILE }}
          SEEGRAM_SSH_KEY: ${{ secrets.SEEGRAM_SSH_KEY }}
          SEEGRAM_UPDATE_SERVER: ${{ secrets.SEEGRAM_UPDATE_SERVER }}
          SEEGRAM_UPDATE_ROOT: ${{ secrets.SEEGRAM_UPDATE_ROOT }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:SEEGRAM_TREE
          if (-not $env:TDESKTOP_API_ID -or -not $env:TDESKTOP_API_HASH) { throw 'Telegram API credentials are missing' }
          .\fork\release.ps1 -Counter ([long]$env:RELEASE_COUNTER)
          if ($LASTEXITCODE -ne 0) { throw 'Windows release failed' }

      - name: Read dependency failure details
        if: ${{ failure() || inputs.diagnostics_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SEEGRAM_TREE) { throw 'Prepared checkout is missing' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          $env:VSLANG = '1033'
          $compilerDir = Split-Path (Get-Command cl.exe).Source -Parent
          Write-Host ('English compiler resources: ' + (Test-Path (Join-Path $compilerDir '1033/clui.dll')))
          & cl.exe 2>&1 | ForEach-Object { Write-Host $_ }
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          Write-Host ('Administrator: ' + $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))
          $libraries = Join-Path (Split-Path $env:SEEGRAM_TREE -Parent) 'Libraries/win64'
          $log = Join-Path $libraries 'ffmpeg/ffbuild/config.log'
          if (Test-Path $log -PathType Leaf) {
            Write-Host 'FFmpeg compiler test:'
            Get-Content $log -Tail 65
          }
          exit 0
