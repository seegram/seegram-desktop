# Build, sign and publish a fork release.
#
# Runs on the fork's own self-hosted runners, which is what makes this both
# safe and cheap: the signing key stays on the machine that already holds it
# and never becomes a repository secret, and self-hosted minutes are free -
# which matters for a private repository, where macOS is billed ten times
# over.
#
# The signing key lives on the runner's filesystem and never in GitHub; where
# it lives is a secret too, so this file names no paths. API credentials
# are supplied through repository secrets, never committed to the tree.
#
# The build deliberately does NOT happen in the runner's own workspace. The
# project resolves its dependencies as "../Libraries" relative to the
# checkout, so a repository anywhere else simply cannot see the 40+ GB of
# prepared libraries - and a fresh workspace would also throw away every
# object file, turning a one-line counter bump into a full rebuild. The job
# therefore syncs the long-lived clone next to those libraries and builds
# there, which keeps an incremental release down to seconds.

name: SeeGram Release
run-name: "SeeGram build ${{ inputs.counter }} · ${{ inputs.request_id || github.sha }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Release bot request ID (leave empty for manual runs)"
        required: false
        type: string
      counter:
        description: "Committed counter from Telegram/SourceFiles/fork/build_counter.h"
        required: true
        type: string
      publish:
        description: "Upload and update the feed (off = build and sign only)"
        required: false
        default: true
        type: boolean

permissions:
  # The run's own token starts read-only, which is the repository default and
  # the right default - but creating the release and attaching the packages to
  # it is a write to the repository. Without this the whole build succeeds and
  # only the last step fails, with GitHub's least helpful error:
  # "Resource not accessible by integration". Nothing else here needs write.
  contents: write

concurrency:
  # Two releases at once would race on the feed and on the build directory.
  group: seegram-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: [self-hosted, Linux, X64, seegram]
    timeout-minutes: 5
    steps:
      - name: Verify the committed counter before starting builds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_COUNTER: ${{ inputs.counter }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, urllib.request
          counter = os.environ['RELEASE_COUNTER']
          if not counter.isascii() or not counter.isdecimal() or not 1 <= int(counter) <= 4294967295:
              raise SystemExit('::error::Counter must be an integer from 1 to 4294967295')
          url = 'https://api.github.com/repos/' + os.environ['RELEASE_REPO'] + '/contents/Telegram/SourceFiles/fork/build_counter.h?ref=' + os.environ['RELEASE_SHA']
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              source = base64.b64decode(json.load(response)['content']).decode()
          committed = re.search(r'^#define SEEGRAM_BUILD_COUNTER (\d+)$', source, re.M)
          if not committed or committed[1] != counter:
              actual = committed[1] if committed else 'missing'
              raise SystemExit(f'::error::Requested build {counter}, committed build {actual}. Use the release bot to prepare and commit the correct version first.')
          print('Validated build ' + counter + ' at ' + os.environ['RELEASE_SHA'])
          PY

  macos:
    needs: validate
    name: macOS (arm64)
    runs-on: [self-hosted, macOS, ARM64, seegram]
    timeout-minutes: 90

    steps:
      - name: Check the release prerequisites
        env:
          SEEGRAM_KEYS_DIR: ${{ secrets.SEEGRAM_KEYS_DIR }}
          SEEGRAM_KEY_FILE: ${{ secrets.SEEGRAM_KEY_FILE }}
        run: |
          set -eu
          KD="${SEEGRAM_KEYS_DIR:?}"; case "$KD" in /*) ;; *) KD="$HOME/$KD";; esac
          if [ ! -f "$KD/${SEEGRAM_KEY_FILE:-signing.pem}" ]; then
            echo "::error::signing key missing on this runner"
            exit 1
          fi
          if [ ! -d "$HOME/TBuild/Libraries/local" ]; then
            echo "::error::prepared libraries missing, run Telegram/build/prepare/mac.sh silent"
            exit 1
          fi
          if [ ! -d "$HOME/TBuild/seegram-desktop/.git" ]; then
            echo "::error::no clone at ~/TBuild/seegram-desktop to build in"
            exit 1
          fi

      - name: Sync the build tree to this commit
        run: |
          set -eu
          cd "$HOME/TBuild/seegram-desktop"
          # The run's own short-lived token: the runner service cannot reach
          # the keychain where this machine's git credentials live.
          git fetch --quiet \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            "${{ github.sha }}"
          git reset --quiet --hard "${{ github.sha }}"
          git submodule update --quiet --init --recursive
          echo "building $(git log -1 --format='%h %s')"

      - name: Build, sign and publish
        env:
          # gh cannot reach the keychain from the runner service; the run's
          # own token is enough to create and upload a release.
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
          GH_TOKEN: ${{ github.token }}
          SEEGRAM_KEYS_DIR: ${{ secrets.SEEGRAM_KEYS_DIR }}
          SEEGRAM_KEY_FILE: ${{ secrets.SEEGRAM_KEY_FILE }}
          SEEGRAM_SSH_KEY: ${{ secrets.SEEGRAM_SSH_KEY }}
          # Secrets rather than variables: GitHub prints every step's env
          # block into the log and masks only secrets, so as variables these
          # put "root@<host>" in plain sight in every job that ever ran.
          SEEGRAM_UPDATE_SERVER: ${{ secrets.SEEGRAM_UPDATE_SERVER }}
          SEEGRAM_UPDATE_ROOT: ${{ secrets.SEEGRAM_UPDATE_ROOT }}
        run: |
          set -eu
          cd "$HOME/TBuild/seegram-desktop"
          : "${TDESKTOP_API_ID:?Set the TDESKTOP_API_ID repository secret}"
          : "${TDESKTOP_API_HASH:?Set the TDESKTOP_API_HASH repository secret}"
          if [ "${{ inputs.publish }}" = "true" ]; then
            fork/release.sh "${{ inputs.counter }}"
          else
            fork/release.sh "${{ inputs.counter }}" --no-publish
          fi

      - name: Report what the feed now serves
        if: always()
        run: |
          echo "### SeeGram release" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          curl -fsS https://desktop.see.tg/current4 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: validate
    name: Linux (x64)
    runs-on: [self-hosted, Linux, X64, seegram]
    timeout-minutes: 180

    # Built inside upstream's rockylinux container so that the binary runs on
    # distributions older than the runner. The image is built once by hand,
    # see the header of fork/release-linux.sh; it is not rebuilt per release
    # because it compiles every dependency from source and takes hours.
    steps:
      - name: Check the release prerequisites
        env:
          SEEGRAM_KEYS_DIR: ${{ secrets.SEEGRAM_KEYS_DIR }}
          SEEGRAM_KEY_FILE: ${{ secrets.SEEGRAM_KEY_FILE }}
        run: |
          set -eu
          KD="${SEEGRAM_KEYS_DIR:?}"; case "$KD" in /*) ;; *) KD="$HOME/$KD";; esac
          if [ ! -f "$KD/${SEEGRAM_KEY_FILE:-signing.pem}" ]; then
            echo "::error::signing key missing on this runner"
            exit 1
          fi
          if ! docker image inspect tdesktop:centos_env >/dev/null 2>&1; then
            echo "::error::docker image tdesktop:centos_env missing on this runner"
            exit 1
          fi
          if [ ! -d "$HOME/TBuild/seegram-desktop/.git" ]; then
            echo "::error::no clone at ~/TBuild/seegram-desktop to build in"
            exit 1
          fi

      - name: Sync the build tree to this commit
        run: |
          set -eu
          cd "$HOME/TBuild/seegram-desktop"
          git fetch --quiet \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            "${{ github.sha }}"
          git reset --quiet --hard "${{ github.sha }}"
          git submodule update --quiet --init --recursive
          echo "building $(git log -1 --format='%h %s')"

      - name: Build, sign and publish
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
          GH_TOKEN: ${{ github.token }}
          SEEGRAM_KEYS_DIR: ${{ secrets.SEEGRAM_KEYS_DIR }}
          SEEGRAM_KEY_FILE: ${{ secrets.SEEGRAM_KEY_FILE }}
          SEEGRAM_SSH_KEY: ${{ secrets.SEEGRAM_SSH_KEY }}
          SEEGRAM_UPDATE_SERVER: ${{ secrets.SEEGRAM_UPDATE_SERVER }}
          SEEGRAM_UPDATE_ROOT: ${{ secrets.SEEGRAM_UPDATE_ROOT }}
        run: |
          set -eu
          cd "$HOME/TBuild/seegram-desktop"
          : "${TDESKTOP_API_ID:?Set the TDESKTOP_API_ID repository secret}"
          : "${TDESKTOP_API_HASH:?Set the TDESKTOP_API_HASH repository secret}"
          if [ "${{ inputs.publish }}" = "true" ]; then
            fork/release-linux.sh "${{ inputs.counter }}"
          else
            fork/release-linux.sh "${{ inputs.counter }}" --no-publish
          fi

      - name: Report what the feed now serves
        if: always()
        run: |
          echo "### SeeGram release" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          curl -fsS https://desktop.see.tg/current4 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: validate
    name: Windows (x64)
    runs-on: [self-hosted, Windows, X64, seegram]
    timeout-minutes: 180

    # Independent of the macOS job on purpose: each platform owns its own
    # entry in the feed, so one failing must not hold the other back.
    steps:
      - name: Check the release prerequisites
        shell: pwsh
        env:
          SEEGRAM_KEYS_DIR: ${{ secrets.SEEGRAM_KEYS_DIR }}
          SEEGRAM_KEY_FILE: ${{ secrets.SEEGRAM_KEY_FILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $kd = $env:SEEGRAM_KEYS_DIR
          if (-not [System.IO.Path]::IsPathRooted($kd)) { $kd = Join-Path $HOME $kd }
          if (-not (Test-Path (Join-Path $kd $(if ($env:SEEGRAM_KEY_FILE) { $env:SEEGRAM_KEY_FILE } else { 'signing.pem' })))) {
            Write-Host "::error::signing key missing on this runner"; exit 1
          }
          if (-not (Test-Path "$env:SEEGRAM_TREE\.git")) {
            Write-Host "::error::SEEGRAM_TREE does not point at a clone to build in"; exit 1
          }
          if (-not (Test-Path "$env:SEEGRAM_TREE\..\Libraries")) {
            Write-Host "::error::prepared libraries missing next to the clone"; exit 1
          }

      - name: Sync the build tree to this commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:SEEGRAM_TREE
          # The run's own short-lived token: the runner service has no
          # credentials of its own for a private repository.
          git fetch --quiet "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "${{ github.sha }}"
          git reset --quiet --hard "${{ github.sha }}"
          git submodule update --quiet --init --recursive
          Write-Host "building $(git log -1 --format='%h %s')"

      - name: Build, sign and publish
        shell: pwsh
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
          GH_TOKEN: ${{ github.token }}
          SEEGRAM_KEYS_DIR: ${{ secrets.SEEGRAM_KEYS_DIR }}
          SEEGRAM_KEY_FILE: ${{ secrets.SEEGRAM_KEY_FILE }}
          SEEGRAM_SSH_KEY: ${{ secrets.SEEGRAM_SSH_KEY }}
          SEEGRAM_UPDATE_SERVER: ${{ secrets.SEEGRAM_UPDATE_SERVER }}
          SEEGRAM_UPDATE_ROOT: ${{ secrets.SEEGRAM_UPDATE_ROOT }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:SEEGRAM_TREE
          if (-not $env:TDESKTOP_API_ID -or -not $env:TDESKTOP_API_HASH) {
            throw "Set the TDESKTOP_API_ID and TDESKTOP_API_HASH repository secrets"
          }
          if ("${{ inputs.publish }}" -eq "true") {
            .\fork\release.ps1 -Counter ${{ inputs.counter }}
          } else {
            .\fork\release.ps1 -Counter ${{ inputs.counter }} -NoPublish
          }

      - name: Report what the feed now serves
        if: always()
        shell: pwsh
        run: |
          "### SeeGram release (Windows)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```json' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          (Invoke-WebRequest -Uri https://desktop.see.tg/current4).Content |
            Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
